name: M0.1 platform smoke

on:
  push:
    branches: [codex/m0-1-platform-spike]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-jvm:
    name: Desktop JVM / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run shared, Ktor, and SQLDelight tests
        run: ./gradlew --no-daemon :probe:jvmTest :desktop-smoke:run :desktop-smoke:installDist printM01ArtifactSizes
        shell: bash
  android-arm64:
    name: Android ARM64 emulator
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: ./gradlew --no-daemon :android-smoke:connectedDebugAndroidTest :android-smoke:assembleDebug printM01ArtifactSizes

  ios-simulator:
    name: iOS simulator ARM64 framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build iOS simulator framework
        run: ./gradlew --no-daemon :probe:linkDebugFrameworkIosArm64 :probe:linkDebugFrameworkIosSimulatorArm64 :probe:iosSimulatorArm64Test printM01ArtifactSizes
      - name: Build Swift consumer
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild -project swift-smoke/MeridianSmoke.xcodeproj -scheme MeridianSmoke -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath build/ios-smoke CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$simulator_id" build/ios-smoke/Build/Products/Debug-iphonesimulator/MeridianSmoke.app
          xcrun simctl launch "$simulator_id" org.meridian.swiftsmoke
          container=$(xcrun simctl get_app_container "$simulator_id" org.meridian.swiftsmoke data)
          for attempt in $(seq 1 30); do
            if [ "$(cat "$container/Documents/m0-1-result.txt" 2>/dev/null)" = PASS ]; then exit 0; fi
            sleep 1
          done
          echo "Swift consumer did not report PASS"
          exit 1
