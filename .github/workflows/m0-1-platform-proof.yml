name: MER-0.1 platform proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR update can arrive through both push and pull_request events. Keep one
# canonical PR run and cancel superseded runs for the same PR.
concurrency:
  group: mer-0-1-${{ github.event.pull_request.number || github.ref }}
  # Keep every platform result for the same PR; do not cancel an active matrix
  # when a documentation or follow-up commit arrives. New runs wait in queue.
  cancel-in-progress: false

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build, test and execute packaged JVM consumer
        run: |
          ./gradlew --warning-mode=all --stacktrace :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Package and launch self-contained desktop app image
        run: |
          input_dir="desktop-consumer/build/install/desktop-consumer/lib"
          main_jar="$(basename "$input_dir"/desktop-consumer*.jar)"
          dest_dir="desktop-consumer/build/jpackage"
          jpackage --type app-image --name MeridianProbe --input "$input_dir" --main-jar "$main_jar" --main-class io.meridian.consumer.MainKt --dest "$dest_dir"
          empty_path="$(mktemp -d)"
          env -u JAVA_HOME -u JAVA_HOME_21_X64 PATH="$empty_path" "$PWD/$dest_dir/MeridianProbe/bin/MeridianProbe"
          du -sh "$dest_dir/MeridianProbe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-linux-desktop
          path: |
            desktop-consumer/build/install/
            desktop-consumer/build/jpackage/

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          # Gradle lock files can remain busy during setup-java's post-job
          # cache save on Windows. Skip only this cache; keep build/test intact.
      - name: Verify committed Gradle Wrapper
        run: .\gradlew.bat --version
      - name: Build, test and execute packaged JVM consumer
        shell: pwsh
        run: |
          .\gradlew.bat --warning-mode=all --stacktrace :engine:desktopTest :desktop-consumer:installDist
          .\desktop-consumer\build\install\desktop-consumer\bin\desktop-consumer.bat
      - name: Package and launch self-contained desktop app image
        shell: pwsh
        run: |
          $inputDir = (Resolve-Path ".\desktop-consumer\build\install\desktop-consumer\lib").Path
          $mainJar = (Get-ChildItem $inputDir -Filter "desktop-consumer*.jar" | Select-Object -First 1).Name
          $destDir = ".\desktop-consumer\build\jpackage"
          jpackage --type app-image --name MeridianProbe --input $inputDir --main-jar $mainJar --main-class io.meridian.consumer.MainKt --dest $destDir
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:JAVA_HOME_21_X64 -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32"
          & ".\desktop-consumer\build\jpackage\MeridianProbe\MeridianProbe.exe"
          $size = (Get-ChildItem ".\desktop-consumer\build\jpackage\MeridianProbe" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Self-contained app image size: {0:N1} MiB" -f ($size / 1MB))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-windows-desktop
          path: |
            desktop-consumer/build/install/
            desktop-consumer/build/jpackage/

  apple-and-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build iOS frameworks, execute simulator tests and test macOS JVM consumer
        run: |
          ./gradlew --warning-mode=all --stacktrace :engine:assembleMeridianSharedDebugXCFramework :engine:iosSimulatorArm64Test :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Package and launch self-contained desktop app image
        run: |
          input_dir="desktop-consumer/build/install/desktop-consumer/lib"
          main_jar="$(basename "$input_dir"/desktop-consumer*.jar)"
          dest_dir="desktop-consumer/build/jpackage"
          jpackage --type app-image --name MeridianProbe --input "$input_dir" --main-jar "$main_jar" --main-class io.meridian.consumer.MainKt --dest "$dest_dir"
          empty_path="$(mktemp -d)"
          env -u JAVA_HOME -u JAVA_HOME_21_X64 PATH="$empty_path" "$PWD/$dest_dir/MeridianProbe.app/Contents/MacOS/MeridianProbe"
          du -sh "$dest_dir/MeridianProbe.app"
      - name: Prepare Swift package consumer
        run: |
          mkdir -p ios-consumer/Frameworks
          cp -R engine/build/XCFrameworks/debug/MeridianShared.xcframework ios-consumer/Frameworks/
      - name: Run native Swift consumer tests
        working-directory: ios-consumer
        run: xcodebuild -scheme MeridianSwiftConsumer -destination 'platform=iOS Simulator,name=iPhone 17' test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-apple-ios
          path: |
            engine/build/XCFrameworks/
            engine/build/test-results/
            ios-consumer/.build/
            desktop-consumer/build/install/
            desktop-consumer/build/jpackage/

  android:
    # GitHub-hosted Linux runners expose KVM for hardware-accelerated x86_64
    # Android emulation. ARM64 device execution remains a separate acceptance gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify Linux x86_64 runner and committed Gradle Wrapper
        run: |
          test "$(uname -m)" = "x86_64"
          ./gradlew --version
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          # Avoid setup-android's deprecated default "tools" package.
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "system-images;android-35;google_apis;x86_64"
      - name: Configure KVM access when available
        run: |
          # Try to load KVM, but do not fail the job when the hosted runner
          # does not expose nested virtualization. The emulator action below
          # detects /dev/kvm and falls back to software acceleration in auto mode.
          sudo modprobe kvm || true
          vendor="$(awk -F: '/vendor_id/ {print $2; exit}' /proc/cpuinfo | xargs)"
          case "$vendor" in
            GenuineIntel) sudo modprobe kvm_intel || true ;;
            AuthenticAMD) sudo modprobe kvm_amd || true ;;
            *) echo "::notice::Unknown CPU vendor for KVM: $vendor" ;;
          esac

          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            test -r /dev/kvm
            test -w /dev/kvm
            echo "KVM is available to the Android emulator."
            ls -l /dev/kvm
          else
            echo "::notice::KVM is unavailable on this runner. Android emulator tests will use software acceleration."
            lsmod | grep -E '^kvm' || true
            ls -la /dev/kvm || true
          fi
      - name: Run Android host-side common tests
        run: ./gradlew --warning-mode=all --stacktrace :engine:testAndroidHostTest
      - name: Run Android x86_64 emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 45
        with:
          disable-animations: true
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          profile: pixel_6
          script: ./gradlew --warning-mode=all --stacktrace :android-consumer:connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-android-x86_64
          path: |
            android-consumer/build/reports/
            android-consumer/build/outputs/androidTest-results/
            engine/build/reports/tests/testAndroidHostTest/

  dependency-metadata:
    # Generate lock state and SHA-256 verification metadata from the complete
    # resolvable dependency graph. This job is limited to the active spike PR.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'spike/m0.1-kmp-platform-proof'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Build platform dependency graphs and generate lock/verification metadata
        run: |
          ./gradlew --no-daemon --no-configuration-cache --write-locks --write-verification-metadata sha256 \
            :engine:assembleMeridianSharedDebugXCFramework \
            :engine:iosSimulatorArm64Test \
            :engine:desktopTest \
            :desktop-consumer:installDist \
            :android-consumer:assembleDebug
      - name: Verify generated metadata files
        shell: bash
        run: |
          test -s gradle/verification-metadata.xml
          echo "Generated lockfiles:"
          find . -name gradle.lockfile -not -path './.gradle/*' -print
          test "$(find . -name gradle.lockfile -not -path './.gradle/*' | wc -l)" -gt 0
          echo "Verification metadata entries:"
          grep -c '<component ' gradle/verification-metadata.xml || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: meridian-gradle-dependency-metadata
          path: |
            **/gradle.lockfile
            gradle/verification-metadata.xml

