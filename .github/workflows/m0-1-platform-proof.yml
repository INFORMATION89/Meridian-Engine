name: M0.1 platform proof

on:
  push:
    branches: ["spike/m0.1-kmp-platform-proof"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Build, test and execute packaged JVM consumer
        run: |
          gradle :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-1-linux-desktop
          path: desktop-consumer/build/install/

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Build, test and execute packaged JVM consumer
        shell: pwsh
        run: |
          gradle :engine:desktopTest :desktop-consumer:installDist
          .\desktop-consumer\build\install\desktop-consumer\bin\desktop-consumer.bat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-1-windows-desktop
          path: desktop-consumer/build/install/

  apple-and-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Build iOS frameworks and execute simulator tests
        run: |
          gradle :engine:assembleMeridianSharedDebugXCFramework :engine:iosSimulatorArm64Test :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Prepare Swift package consumer
        run: |
          mkdir -p ios-consumer/Frameworks
          cp -R engine/build/XCFrameworks/debug/MeridianShared.xcframework ios-consumer/Frameworks/
      - name: Run native Swift consumer tests
        working-directory: ios-consumer
        run: swift test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-1-apple-ios
          path: |
            engine/build/XCFrameworks/
            engine/build/test-results/
            ios-consumer/.build/

  android-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - uses: android-actions/setup-android@v3
      - name: Run ARM64 Android emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          script: gradle :android-consumer:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-1-android-arm64
          path: |
            android-consumer/build/reports/
            android-consumer/build/outputs/androidTest-results/
