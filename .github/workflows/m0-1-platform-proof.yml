name: MER-0.1 platform proof

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a PR needs a complete platform result.
concurrency:
  group: mer-0-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-license-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Generate CycloneDX SBOM and bootstrap audit-tool checksums
        shell: bash
        run: |
          run_gradle_with_retries() {
            local attempt
            for attempt in 1 2 3; do
              echo "Gradle audit attempt ${attempt}/3"
              if ./gradlew --max-workers=2 --no-daemon --no-configuration-cache "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep_seconds=$((attempt * 20))
                echo "Dependency resolution failed; retrying in ${sleep_seconds}s."
                sleep "$sleep_seconds"
              fi
            done
            echo "Gradle audit failed after 3 attempts." >&2
            return 1
          }
          run_gradle_with_retries \
            --write-verification-metadata sha256 \
            --init-script ci/license-audit.init.gradle.kts \
            cyclonedxBom
      - name: Re-run SBOM generation with strict dependency verification
        shell: bash
        run: |
          run_gradle_with_retries() {
            local attempt
            for attempt in 1 2 3; do
              echo "Strict Gradle audit attempt ${attempt}/3"
              if ./gradlew --max-workers=2 --no-daemon --no-configuration-cache "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep_seconds=$((attempt * 20))
                echo "Dependency resolution failed; retrying in ${sleep_seconds}s."
                sleep "$sleep_seconds"
              fi
            done
            echo "Strict Gradle audit failed after 3 attempts." >&2
            return 1
          }
          run_gradle_with_retries \
            --init-script ci/license-audit.init.gradle.kts \
            cyclonedxBom
      - name: Summarize license metadata
        run: |
          python3 ci/summarize-sbom.py build/reports/cyclonedx/bom.json \
            --output build/reports/cyclonedx/license-metadata-summary.md \
            --lockfile engine/gradle.lockfile \
            --lockfile android-consumer/gradle.lockfile \
            --lockfile desktop-consumer/gradle.lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-dependency-license-audit
          retention-days: 7
          path: |
            build/reports/cyclonedx/
            engine/build/reports/cyclonedx-direct/
            android-consumer/build/reports/cyclonedx-direct/
            desktop-consumer/build/reports/cyclonedx-direct/
            gradle/verification-metadata.xml
            engine/gradle.lockfile
            android-consumer/gradle.lockfile
            desktop-consumer/gradle.lockfile

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.job == 'android') }}
      - name: Start local HTTP fixture server
        run: |
          python3 ci/fixture_server.py >/tmp/meridian-fixture.log 2>&1 &
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/probe.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/meridian-fixture.log
          exit 1
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build, test and execute packaged JVM consumer
        run: |
          ./gradlew --warning-mode=all --stacktrace :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Package and launch self-contained desktop app image
        run: |
          input_dir="desktop-consumer/build/install/desktop-consumer/lib"
          main_jar="$(basename "$input_dir"/desktop-consumer*.jar)"
          dest_dir="desktop-consumer/build/jpackage"
          jpackage --type app-image --name MeridianProbe --input "$input_dir" --main-jar "$main_jar" --main-class io.meridian.consumer.MainKt --dest "$dest_dir"
          empty_path="$(mktemp -d)"
          env -u JAVA_HOME -u JAVA_HOME_21_X64 PATH="$empty_path" "$PWD/$dest_dir/MeridianProbe/bin/MeridianProbe"
          du -sh "$dest_dir/MeridianProbe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-linux-desktop
          retention-days: 7
          path: |
            desktop-consumer/build/install/
            desktop-consumer/build/jpackage/

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          # setup-gradle below owns Gradle caching on Windows; avoid the
          # separate setup-java cache hook that previously hit file-lock issues.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.job == 'android') }}
      - name: Start local HTTP fixture server
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList @('ci/fixture_server.py') -WindowStyle Hidden
          $ready = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:8765/probe.json' -UseBasicParsing | Out-Null
              $ready = $true
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw 'Local HTTP fixture server did not start.' }
      - name: Verify committed Gradle Wrapper
        run: .\gradlew.bat --version
      - name: Build, test and execute packaged JVM consumer
        shell: pwsh
        run: |
          .\gradlew.bat --warning-mode=all --stacktrace :engine:desktopTest :desktop-consumer:installDist
          .\desktop-consumer\build\install\desktop-consumer\bin\desktop-consumer.bat
          # Stop Gradle daemons so file locks do not prevent the Basic cache from being archived.
          .\gradlew.bat --stop
      - name: Package and launch self-contained desktop app image
        shell: pwsh
        run: |
          $inputDir = (Resolve-Path ".\desktop-consumer\build\install\desktop-consumer\lib").Path
          $mainJar = (Get-ChildItem $inputDir -Filter "desktop-consumer*.jar" | Select-Object -First 1).Name
          $destDir = ".\desktop-consumer\build\jpackage"
          jpackage --type app-image --name MeridianProbe --input $inputDir --main-jar $mainJar --main-class io.meridian.consumer.MainKt --dest $destDir
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:JAVA_HOME_21_X64 -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32"
          & ".\desktop-consumer\build\jpackage\MeridianProbe\MeridianProbe.exe"
          $size = (Get-ChildItem ".\desktop-consumer\build\jpackage\MeridianProbe" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Self-contained app image size: {0:N1} MiB" -f ($size / 1MB))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-windows-desktop
          retention-days: 7
          path: |
            desktop-consumer/build/install/
            desktop-consumer/build/jpackage/

  apple-and-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.job == 'android') }}
      - name: Start local HTTP fixture server
        run: |
          python3 ci/fixture_server.py >/tmp/meridian-fixture.log 2>&1 &
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/probe.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/meridian-fixture.log
          exit 1
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build iOS frameworks, execute simulator tests and test macOS JVM consumer
        run: |
          ./gradlew --warning-mode=all --stacktrace :engine:assembleMeridianSharedDebugXCFramework :engine:iosSimulatorArm64Test :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Package and launch self-contained desktop app image
        run: |
          input_dir="desktop-consumer/build/install/desktop-consumer/lib"
          main_jar="$(basename "$input_dir"/desktop-consumer*.jar)"
          dest_dir="desktop-consumer/build/jpackage"
          jpackage --type app-image --name MeridianProbe --input "$input_dir" --main-jar "$main_jar" --main-class io.meridian.consumer.MainKt --dest "$dest_dir"
          empty_path="$(mktemp -d)"
          env -u JAVA_HOME -u JAVA_HOME_21_X64 PATH="$empty_path" "$PWD/$dest_dir/MeridianProbe.app/Contents/MacOS/MeridianProbe"
          du -sh "$dest_dir/MeridianProbe.app"
      - name: Prepare Swift package consumer
        run: |
          mkdir -p ios-consumer/Frameworks
          cp -R engine/build/XCFrameworks/debug/MeridianShared.xcframework ios-consumer/Frameworks/
      - name: Run native Swift consumer tests
        working-directory: ios-consumer
        run: xcodebuild -scheme MeridianSwiftConsumer -destination 'platform=iOS Simulator,name=iPhone 17' test
      - name: Inspect local fixture server requests
        if: always()
        run: cat /tmp/meridian-fixture.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-apple-ios
          retention-days: 7
          path: |
            engine/build/XCFrameworks/
            engine/build/test-results/
            ios-consumer/.build/
            desktop-consumer/build/install/
            desktop-consumer/build/jpackage/

  android:
    # Prefer KVM for x86_64 Android emulation when the hosted runner exposes it.
    # Fall back to explicit TCG software emulation if KVM is unavailable.
    # Android ARM64 runtime remains a separate device/host acceptance gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Linux x86_64 runner and committed Gradle Wrapper
        run: |
          test "$(uname -m)" = "x86_64"
          ./gradlew --version
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          # Avoid setup-android's deprecated default "tools" package.
          packages: platform-tools
      - name: Install only missing Android compile SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?Android SDK path is not configured}"

          # android-emulator-runner installs the emulator, its selected API level,
          # and matching system image itself. Only prepare the separate compile SDK.
          missing_packages=()
          ensure_sdk_package() {
            local package="$1"
            local relative_path="$2"
            if [[ ! -e "$sdk_root/$relative_path" ]]; then
              missing_packages+=("$package")
            fi
          }

          ensure_sdk_package "platforms;android-36" "platforms/android-36"
          ensure_sdk_package "build-tools;36.0.0" "build-tools/36.0.0"

          if (( ${#missing_packages[@]} > 0 )); then
            printf 'Installing missing Android compile SDK packages: %s\n' "${missing_packages[*]}"
            sdkmanager "${missing_packages[@]}"
          else
            echo "All required Android compile SDK packages are already present on the runner."
          fi
      - name: Configure KVM access when possible
        run: |
          # KVM is optional on hosted runners. Try to load the host modules and
          # grant the current runner access when the device exists. The emulator
          # action's "auto" mode checks read/write access and selects software
          # acceleration when KVM is missing or inaccessible.
          sudo modprobe kvm || true
          vendor="$(awk -F: '/vendor_id/ {print $2; exit}' /proc/cpuinfo | xargs)"
          case "$vendor" in
            GenuineIntel) sudo modprobe kvm_intel || true ;;
            AuthenticAMD) sudo modprobe kvm_amd || true ;;
            *) echo "::notice::Unknown CPU vendor for KVM: $vendor" ;;
          esac

          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod a+rw /dev/kvm || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available to the Android emulator."
            ls -l /dev/kvm
          else
            echo "::notice::KVM is missing or inaccessible. Emulator action auto mode will use software acceleration."
            lsmod | grep -E '^kvm' || true
            ls -la /dev/kvm || true
          fi
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.job == 'android') }}
      - name: Start local HTTP fixture server
        run: |
          python3 ci/fixture_server.py >/tmp/meridian-fixture.log 2>&1 &
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/probe.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/meridian-fixture.log
          exit 1
      - name: Run Android host-side common tests
        run: ./gradlew --warning-mode=all --stacktrace :engine:testAndroidHostTest
      - name: Run Android x86_64 emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 45
        with:
          disable-animations: true
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          profile: pixel_6
          script: ./gradlew --warning-mode=all --stacktrace :android-consumer:connectedDebugAndroidTest
        env:
          # Android Emulator refuses -accel off without this explicit opt-in.
          ANDROID_I_WANT_MY_TCG: "yes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mer-0-1-android-x86_64
          retention-days: 7
          path: |
            android-consumer/build/reports/
            android-consumer/build/outputs/androidTest-results/
            engine/build/reports/tests/testAndroidHostTest/
