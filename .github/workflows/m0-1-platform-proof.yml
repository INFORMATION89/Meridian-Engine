name: MER-0.1 platform proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR update can arrive through both push and pull_request events. Keep one
# canonical PR run and cancel superseded runs for the same PR.
concurrency:
  group: mer-0-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build, test and execute packaged JVM consumer
        run: |
          ./gradlew --stacktrace --info :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-linux-desktop
          path: desktop-consumer/build/install/

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify committed Gradle Wrapper
        run: .\gradlew.bat --version
      - name: Build, test and execute packaged JVM consumer
        shell: pwsh
        run: |
          .\gradlew.bat :engine:desktopTest :desktop-consumer:installDist
          .\desktop-consumer\build\install\desktop-consumer\bin\desktop-consumer.bat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-windows-desktop
          path: desktop-consumer/build/install/

  apple-and-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build iOS frameworks and execute simulator tests
        run: |
          ./gradlew :engine:assembleMeridianSharedDebugXCFramework :engine:iosSimulatorArm64Test :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Prepare Swift package consumer
        run: |
          mkdir -p ios-consumer/Frameworks
          cp -R engine/build/XCFrameworks/debug/MeridianShared.xcframework ios-consumer/Frameworks/
      - name: Run native Swift consumer tests
        working-directory: ios-consumer
        run: xcodebuild -scheme MeridianSwiftConsumer -destination 'platform=iOS Simulator,name=iPhone 17' test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-apple-ios
          path: |
            engine/build/XCFrameworks/
            engine/build/test-results/
            ios-consumer/.build/

  android:
    # Use the stable x86_64 emulator on the standard x64 GitHub-hosted runner.
    # The Android consumer has no ARM64-only ABI requirement.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify x86_64 runner and committed Gradle Wrapper
        run: |
          test "$(uname -m)" = "x86_64"
          ./gradlew --version
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          # Avoid setup-android's deprecated default "tools" package.
          packages: platform-tools
      # Install each package in its own sdkmanager invocation. The action's
      # multiline packages input is passed as one argument by this version.
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"
      - name: Run Android x86_64 emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        # GitHub's standard Linux runner does not expose KVM to this job.
        # Explicitly allow the emulator's software CPU backend instead of
        # letting the action force -accel off without enabling TCG.
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          # TCG boot is slow and Android settings services can be unstable
          # immediately after boot; avoid optional post-boot animation writes.
          disable-animations: false
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          profile: pixel_6
          script: ./gradlew --stacktrace :android-consumer:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-android-x86_64
          path: |
            android-consumer/build/reports/
            android-consumer/build/outputs/androidTest-results/
