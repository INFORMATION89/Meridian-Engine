name: MER-0.1 platform proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR update can arrive through both push and pull_request events. Keep one
# canonical PR run and cancel superseded runs for the same PR.
concurrency:
  group: mer-0-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build, test and execute packaged JVM consumer
        run: |
          ./gradlew --stacktrace --info :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-linux-desktop
          path: desktop-consumer/build/install/

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify committed Gradle Wrapper
        run: .\gradlew.bat --version
      - name: Build, test and execute packaged JVM consumer
        shell: pwsh
        run: |
          .\gradlew.bat :engine:desktopTest :desktop-consumer:installDist
          .\desktop-consumer\build\install\desktop-consumer\bin\desktop-consumer.bat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-windows-desktop
          path: desktop-consumer/build/install/

  apple-and-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify committed Gradle Wrapper
        run: ./gradlew --version
      - name: Build iOS frameworks and execute simulator tests
        run: |
          ./gradlew :engine:assembleMeridianSharedDebugXCFramework :engine:iosSimulatorArm64Test :engine:desktopTest :desktop-consumer:installDist
          ./desktop-consumer/build/install/desktop-consumer/bin/desktop-consumer
      - name: Prepare Swift package consumer
        run: |
          mkdir -p ios-consumer/Frameworks
          cp -R engine/build/XCFrameworks/debug/MeridianShared.xcframework ios-consumer/Frameworks/
      - name: Run native Swift consumer tests
        working-directory: ios-consumer
        run: xcodebuild -scheme MeridianSwiftConsumer -destination 'platform=iOS Simulator,name=iPhone 17' test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-apple-ios
          path: |
            engine/build/XCFrameworks/
            engine/build/test-results/
            ios-consumer/.build/

  android-arm64:
    # Match the emulator guest architecture to the physical runner architecture.
    # This avoids software-emulating ARM64 on an x64 hosted runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64
      - name: Verify ARM64 runner and committed Gradle Wrapper
        run: |
          test "$(uname -m)" = "aarch64"
          ./gradlew --version
      # The stable Android SDK repository does not publish the emulator package
      # for Linux ARM64. Install the ARM64-host emulator from the canary channel
      # first, then install the stable platform and ARM64 guest system image.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install ARM64-host Android emulator from canary
        run: sdkmanager --channel=3 "emulator"
      - name: Install Android 35 platform and ARM64 Google APIs image
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;arm64-v8a"
      - name: Run ARM64 Android emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          profile: pixel_6
          script: ./gradlew --stacktrace :android-consumer:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mer-0-1-android-arm64
          path: |
            android-consumer/build/reports/
            android-consumer/build/outputs/androidTest-results/
